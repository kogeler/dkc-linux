# Linux 7.1 source compatibility profile: build inputs.
#
# Every value in this file is specific to the Debian linux source of the 7.1
# upstream series and is part of the kernel publication identity. Acceptance
# checks for the same series live in validation.toml; the packaging overlay
# lives in debian-overlay/patches/7.1/.
schema_version = 1
kernel_series = "7.1"
reviewed_source_version = "7.1.7-1"

[debian]
# Debian build profiles used for the DKC kernel build.
#
# One set, version-controlled, passed identically to dependency resolution and
# to the actual build. Passing different sets to the two is how a build ends up
# resolving dependencies it will not use, or using dependencies it did not
# resolve.
#
# Measured against linux 7.1.7-1 on 2026-08-11: this set takes the declared
# amd64 build dependencies from 65 packages to 24.
#
#   nodoc                 Documentation is not part of a DKC deliverable, and it
#                         pulls asciidoctor and the Ruby stack behind it.
#   pkg.linux.notools     perf, cpupower and friends are not DKC packages. This
#                         is the profile that drops most of the closure.
#   pkg.linux.nosource    The linux-source tarball package is not published;
#                         DKC publishes its own complete source package.
#   noudeb                Excludes Debian-installer binary package stanzas.
#   pkg.linux.noudeb      Excludes their architecture build dependencies.
#                         Debian 7.1 uses both names, so both are required.
#   pkg.linux.nokerneldbg Debian's kernel debug binary package is not a DKC
#                         deliverable. This does not disable build-time debug
#                         information or BTF; nokerneldbginfo would do that.
#
# Deliberately not set: pkg.linux.norust (Rust is enabled in Debian's amd64
# configuration), pkg.linux.nokerneldbginfo (disables debug information and
# BTF), and pkg.linux.mintools (overlaps with notools).
build_profiles = ["nodoc", "noudeb", "pkg.linux.notools", "pkg.linux.nosource", "pkg.linux.noudeb", "pkg.linux.nokerneldbg"]

# Debian's complete kernel architecture inventory, in source order. The
# published source package enables only amd64; every other entry is rendered
# as an explicit exclusion, and any upstream inventory change fails source
# preparation instead of silently expanding the package graph.
[debian.kernel_architectures]
alpha = ["alpha"]
arc = ["arc"]
arm = ["armel", "armhf"]
arm64 = ["arm64"]
parisc = ["hppa"]
loongarch = ["loong64"]
m68k = ["m68k"]
mips = ["mips", "mips64", "mips64r6", "mips64el", "mips64r6el", "mipsel", "mipsn32", "mipsn32el", "mipsn32r6", "mipsn32r6el", "mipsr6", "mipsr6el"]
powerpc = ["powerpc", "ppc64", "ppc64el"]
riscv = ["riscv64"]
s390 = ["s390x"]
sh = ["sh4"]
sparc = ["sparc64"]
x86 = ["amd64", "i386", "x32"]

[fpu]
